name: Nightly GitHub Contribution Reminder

on:
  schedule:
    # 8:30 PM EDT (UTC-4). In EST (Nov–Mar) this fires at 7:30 PM — adjust to '30 1 * * *' then.
    - cron: '30 0 * * *'
  workflow_dispatch:  # lets you trigger manually to test

jobs:
  check-and-remind:
    runs-on: ubuntu-latest

    steps:
      - name: Check today's contributions
        id: check
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          # Get today's date in Eastern Time so "today" matches your local day
          TODAY=$(TZ="America/New_York" date +%Y-%m-%d)
          OFFSET=$(TZ="America/New_York" date +%z | sed 's/\([+-][0-9][0-9]\)\([0-9][0-9]\)/\1:\2/')
          FROM="${TODAY}T00:00:00${OFFSET}"
          TO="${TODAY}T23:59:59${OFFSET}"

          echo "Checking contributions for $TODAY (offset $OFFSET)"

          QUERY='query($from:DateTime!,$to:DateTime!){user(login:"NavyaMehrotra1"){contributionsCollection(from:$from,to:$to){contributionCalendar{totalContributions}}}}'
          PAYLOAD=$(jq -n \
            --arg q  "$QUERY" \
            --arg from "$FROM" \
            --arg to   "$TO" \
            '{query: $q, variables: {from: $from, to: $to}}')

          RESPONSE=$(curl -sf \
            -H "Authorization: Bearer $GH_PAT" \
            -H "Content-Type: application/json" \
            -X POST https://api.github.com/graphql \
            -d "$PAYLOAD")

          TOTAL=$(echo "$RESPONSE" | jq -r \
            '.data.user.contributionsCollection.contributionCalendar.totalContributions // 0')

          echo "Contributions today: $TOTAL"
          echo "total=$TOTAL" >> "$GITHUB_OUTPUT"

      - name: Send reminder email
        if: steps.check.outputs.total == '0'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "No GitHub commits today — don't break your streak!"
          to: nmehrot2@jh.edu
          from: GitHub Reminder <${{ secrets.MAIL_USERNAME }}>
          content_type: text/html
          body: |
            <div style="font-family:sans-serif;max-width:480px;margin:0 auto;padding:24px;">
              <h2 style="color:#f0883e;margin-top:0;">No commits yet today!</h2>
              <p style="color:#333;">Hey Navya, you haven't made any GitHub contributions today.</p>
              <p style="color:#333;">Even one small commit keeps your streak alive. 💚</p>
              <a href="https://github.com/NavyaMehrotra1"
                 style="display:inline-block;margin-top:16px;padding:12px 24px;
                        background:#238636;color:#fff;border-radius:6px;
                        text-decoration:none;font-weight:bold;">
                Open GitHub →
              </a>
              <p style="margin-top:24px;font-size:12px;color:#888;">
                Sent by your GitHub Reminder ·
                <a href="https://github.com/NavyaMehrotra1/github_reminder/actions" style="color:#888;">manage workflow</a>
              </p>
            </div>
